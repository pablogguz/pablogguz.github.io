<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c1453b"/>
      <stop offset="100%" stop-color="#962f28"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#1a1816"/>

  <!-- Graduation cap top (diamond shape) -->
  <polygon points="16,6 5,12 16,18 27,12" fill="url(#capGrad)"/>

  <!-- Cap band/base -->
  <path d="M9 13 L9 19 Q16 24 23 19 L23 13"
        fill="none"
        stroke="#c1453b"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Tassel string -->
  <path d="M24.5 12 Q26 14 25 17"
        fill="none"
        stroke="#f7f5f0"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Tassel end -->
  <circle cx="25" cy="18" r="1.8" fill="#f7f5f0"/>

  <!-- Rising bar chart underneath (subtle) -->
  <rect x="8" y="25" width="3" height="3" rx="0.5" fill="#2d5a4a" opacity="0.8"/>
  <rect x="12.5" y="23" width="3" height="5" rx="0.5" fill="#2d5a4a" opacity="0.8"/>
  <rect x="17" y="21" width="3" height="7" rx="0.5" fill="#2d5a4a" opacity="0.8"/>
  <rect x="21.5" y="24" width="3" height="4" rx="0.5" fill="#2d5a4a" opacity="0.8"/>
</svg>
