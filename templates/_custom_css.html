<style>
  /* ========================================
     ELEGANT MINIMAL DESIGN SYSTEM
     Refined typography + subtle micro-interactions
     ======================================== */

  /* Import Geist fonts */
  @import url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-sans/style.min.css');
  @import url('https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-mono/style.min.css');

  /* ----------------------------------------
     LIGHT MODE - Warm, refined palette
     ---------------------------------------- */
  body {
    --primary-color: #5a67d8;
    --primary-pale-color: #5a67d810;
    --primary-hover: #4c51bf;
    --accent-color: #5a67d8;
    --accent-pale: #5a67d810;

    --text-color: #1a202c;
    --text-secondary: #4a5568;
    --text-pale-color: #a0aec0;
    --bg-color: #fafaf9;
    --bg-secondary: #f5f5f4;
    --card-bg-color: #ffffff;
    --border-color: #e8e8e6;
    --border-hover: #d4d4d2;
    --highlight-mark-color: #5a67d820;

    /* Callout colors - muted, sophisticated */
    --callout-note-color: #5a67d8;
    --callout-important-color: #805ad5;
    --callout-warning-color: #b7791f;
    --callout-alert-color: #c53030;
    --callout-question-color: #2b6cb0;
    --callout-tip-color: #276749;

    /* Typography - Geist fonts */
    --main-font: "Geist", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono-font: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --code-font: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    /* Spacing - 4px base grid */
    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;
    --space-5: 48px;
    --space-6: 64px;

    /* Layout */
    --homepage-max-width: 680px;
    --main-max-width: 680px;
    --avatar-size: 56px;
    --icon-size: 18px;
    --homepage-font-size: 16px;
    --homepage-line-height: 1.7;
    --paragraph-font-size: 17px;
    --paragraph-line-height: 1.75;
    --aside-font-size: 14px;

    /* Borders - refined */
    --border-radius: 8px;
    --border-radius-sm: 4px;
    --border-radius-lg: 12px;
    --img-border-radius: 6px;
    --inline-code-border-radius: 4px;
    --inline-code-bg-color: var(--bg-secondary);
    --block-code-border-radius: 8px;
    --block-code-border-color: var(--border-color);

    /* Shadows - soft, layered */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.08);
    --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.1);

    /* Rendering */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ----------------------------------------
     DARK MODE - Deep, restful tones
     ---------------------------------------- */
  body.dark {
    --primary-color: #a0aec0;
    --primary-pale-color: #a0aec010;
    --primary-hover: #cbd5e0;
    --accent-color: #b794f4;
    --accent-pale: #b794f415;

    --text-color: #e2e8f0;
    --text-secondary: #a0aec0;
    --text-pale-color: #718096;
    --bg-color: #171923;
    --bg-secondary: #1a202c;
    --card-bg-color: #1e2533;
    --border-color: #2d3748;
    --border-hover: #4a5568;
    --highlight-mark-color: #b794f420;

    --callout-note-color: #90cdf4;
    --callout-important-color: #b794f4;
    --callout-warning-color: #f6ad55;
    --callout-alert-color: #fc8181;
    --callout-question-color: #63b3ed;
    --callout-tip-color: #68d391;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.35);
    --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);

    --primary-color: #6b9edd;
    --primary-pale-color: #6b9edd15;
    --primary-hover: #85b3e8;
    --accent-color: #6b9edd;
  }

  /* ----------------------------------------
     ENSURE TEXT COLOR IS APPLIED
     ---------------------------------------- */
  body, body p, body li, body span, body div {
    color: var(--text-color);
  }

  /* ----------------------------------------
     BASE TRANSITIONS
     ---------------------------------------- */
  * {
    transition: none;
  }

  a, button, input, textarea, .project-card, .viz-card, .link-button, .desc-button, img {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body, body * {
    transition: background-color 0.3s ease, color 0.2s ease, border-color 0.2s ease;
  }

  /* ----------------------------------------
     AVATAR - Squared with subtle shadow
     ---------------------------------------- */
  #myAvatar {
    width: 112px !important;
    height: auto !important;
    border-radius: 4px !important;
    border: 2px solid var(--border-color);
    box-shadow: var(--shadow-md);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
  }

  #myAvatar:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }

  body.dark #myAvatar {
    border-color: var(--border-color);
  }

  /* ----------------------------------------
     LINKS - Distinctive color with underline animation
     ---------------------------------------- */
  .prose a {
    color: var(--primary-color);
    text-decoration: none;
    border-bottom: none;
    background-image: linear-gradient(var(--primary-color), var(--primary-color));
    background-size: 0% 1px;
    background-position: 0 100%;
    background-repeat: no-repeat;
    transition: background-size 0.3s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s ease;
    font-weight: 500;
  }

  .prose a:hover {
    color: var(--primary-hover);
    background-size: 100% 1px;
  }

  .prose a::after {
    display: none;
  }

  /* ----------------------------------------
     READING TIME & METADATA
     ---------------------------------------- */
  #reading-time {
    font-family: var(--mono-font);
    font-size: 0.85em;
    color: var(--text-pale-color);
    font-weight: 400;
    letter-spacing: 0;
  }

  /* ----------------------------------------
     FIGCAPTION & FIGURE NOTES
     ---------------------------------------- */
  figcaption {
    font-family: var(--main-font);
    font-size: 0.875em;
    font-weight: 500;
    text-align: center;
    color: var(--text-secondary);
    margin-top: var(--space-2);
    margin-bottom: var(--space-1);
  }

  .figure-note {
    text-align: left;
    font-size: 0.82em !important;
    color: var(--text-pale-color);
  }

  /* ----------------------------------------
     BUTTONS - Refined, subtle
     ---------------------------------------- */
  .desc-button,
  .link-button {
    font-family: var(--mono-font);
    font-size: 12px;
    font-weight: 450;
    letter-spacing: 0;
    color: var(--text-secondary);
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    padding: 10px 16px;
    height: auto;
    line-height: 1.4;
    border-radius: var(--border-radius);
    cursor: pointer;
    outline: none;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-right: 8px;
    margin-bottom: 8px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .desc-button:hover,
  .link-button:hover {
    background: var(--card-bg-color);
    border-color: var(--border-hover);
    color: var(--text-color);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .desc-button:active,
  .link-button:active {
    transform: translateY(0);
    box-shadow: var(--shadow-sm);
  }

  /* Triangle for collapsible */
  .desc-button .triangle {
    display: inline-block;
    transition: transform 0.2s ease;
  }

  .desc-button.collapsed .triangle {
    transform: rotate(-90deg);
  }

  .desc {
    font-size: 0.9em;
    color: var(--text-secondary);
    line-height: 1.65;
  }

  /* ----------------------------------------
     LINKS SECTION (Homepage)
     ---------------------------------------- */
  .links {
    display: flex;
    align-items: center;
    font-size: 0.85em;
    gap: var(--space-2);
  }

  /* ----------------------------------------
     DISCLAIMER, COPYRIGHT, CREDITS
     ---------------------------------------- */
  .disclaimer,
  .copyright,
  .credits {
    font-size: 0.8em;
    color: var(--text-pale-color);
  }

  /* ----------------------------------------
     MODAL - Clean, floating style
     ---------------------------------------- */
  .modal {
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-lg);
    padding: var(--space-4);
    max-width: 560px;
    background: var(--card-bg-color);
    color: var(--text-color);
    box-shadow: var(--shadow-lg);
  }

  .modal[open] {
    animation: modalFadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes modalFadeIn {
    from {
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .modal::backdrop {
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
  }

  .modal-content {
    font-size: 0.95em;
    line-height: 1.65;
  }

  .modal-content h3 {
    font-family: var(--main-font);
    margin-top: 0;
    margin-bottom: var(--space-3);
    font-size: 1.25em;
    font-weight: 600;
    color: var(--text-color);
    letter-spacing: -0.01em;
  }

  .modal-content ul {
    padding-left: var(--space-3);
    margin: var(--space-2) 0;
  }

  .modal-content li {
    margin-bottom: var(--space-1);
    color: var(--text-secondary);
  }

  .modal-close {
    font-family: var(--main-font);
    float: right;
    padding: 10px 20px;
    margin-top: var(--space-3);
    background: var(--text-color);
    color: var(--bg-color);
    border: none;
    border-radius: var(--border-radius);
    font-size: 0.875em;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .modal-close:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  .modal-close:active {
    transform: translateY(0);
  }

  /* Coffee button */
  #coffee-btn {
    text-decoration: none;
    color: var(--accent-color);
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }

  #coffee-btn:hover {
    border-bottom-color: var(--accent-color);
  }
</style>

<style>
  /* ========================================
     WIDE LAYOUT - For projects/policy pages
     ======================================== */
  #wrapper.wide-layout {
    max-width: 1400px !important;
    padding: 0 24px;
  }

  #wrapper.wide-layout main {
    max-width: 100%;
  }

  /* ========================================
     PROJECT CARDS - 3 columns, equal height
     ======================================== */
  .projects-container {
    max-width: 100%;
    margin: 0 auto;
    padding: var(--space-3) 0;
  }

  .project-card {
    background: var(--card-bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-lg);
    padding: var(--space-4);
    margin: 0;
    position: relative;
    box-shadow: var(--shadow-sm);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .project-card .card-content {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .project-card::before {
    display: none;
  }

  .project-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  /* Project sections */
  .project-section {
    margin-bottom: var(--space-6);
  }

  .section-title {
    font-family: var(--mono-font);
    font-size: 0.8em;
    font-weight: 500;
    color: var(--text-pale-color);
    margin-bottom: var(--space-3);
    padding-bottom: var(--space-1);
    border-bottom: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Grid layout for projects - 3 columns, equal height */
  .project-grid {
    display: grid;
    gap: var(--space-3);
    grid-template-columns: repeat(3, 1fr);
  }

  @media (max-width: 1100px) {
    .project-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 700px) {
    .project-grid {
      grid-template-columns: 1fr;
    }

    #wrapper.wide-layout {
      padding: 0 16px;
    }
  }

  /* Compact card variant */
  .project-card.compact {
    margin: 0;
    padding: var(--space-3);
  }

  .project-card.compact .project-desc {
    font-size: 0.9em;
    margin-bottom: var(--space-2);
  }

  .project-card.compact .project-links {
    margin-bottom: var(--space-2);
  }

  .project-title {
    font-family: var(--mono-font);
    font-size: 1.05em;
    color: var(--text-color);
    margin: 0 0 var(--space-2) 0;
    font-weight: 500;
    letter-spacing: 0;
  }

  .project-desc {
    font-family: var(--main-font);
    color: var(--text-secondary);
    line-height: 1.65;
    font-size: 0.92em;
    margin-bottom: var(--space-3);
    flex: 1;
  }

  .project-links {
    display: flex;
    gap: var(--space-1);
    flex-wrap: wrap;
    margin-top: auto;
    padding-top: var(--space-2);
  }

  .media-section {
    margin: 0;
    padding-top: var(--space-3);
    border-top: 1px solid var(--border-color);
  }

  .media-label {
    font-family: var(--mono-font);
    display: block;
    color: var(--text-pale-color);
    margin-bottom: var(--space-1);
    font-weight: 400;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .media-links {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .media-links a {
    color: var(--text-secondary);
    text-decoration: none;
    padding: 4px 0;
    font-size: 0.9em;
    border-bottom: 1px solid transparent;
    transition: all 0.2s ease;
  }

  .media-links a:hover {
    color: var(--text-color);
    border-bottom-color: var(--text-color);
  }

  /* Tags - Minimal pill style */
  .project-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: var(--space-2);
  }

  .tag {
    font-family: var(--mono-font);
    font-size: 10px;
    color: var(--text-pale-color);
    padding: 4px 10px;
    border: 1px solid var(--border-color);
    border-radius: 100px;
    background: var(--bg-secondary);
    font-weight: 400;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* ========================================
     PORTFOLIO INTRO
     ======================================== */
  .portfolio-intro {
    padding: var(--space-6) var(--space-4) var(--space-5);
    text-align: center;
    max-width: 1000px;
    margin: 0 auto;
  }

  .portfolio-intro h1 {
    font-family: var(--mono-font);
    font-size: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    font-weight: 500;
    letter-spacing: 0;
  }

  .portfolio-intro p {
    font-family: var(--main-font);
    color: var(--text-secondary);
    font-size: 1.05em;
    line-height: 1.65;
    max-width: 600px;
    margin: 0 auto;
  }

  /* ========================================
     VISUALIZATION CARDS
     ======================================== */
  .viz-card {
    background: var(--card-bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-lg);
    padding: var(--space-4);
    margin: var(--space-4) auto;
    max-width: 1300px;
    position: relative;
    box-shadow: var(--shadow-sm);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .viz-card::before {
    display: none;
  }

  .viz-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  .viz-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: var(--space-2);
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .viz-header h2 {
    font-family: var(--mono-font);
    font-size: 1.05em;
    margin: 0;
    color: var(--text-color);
    font-weight: 500;
    letter-spacing: 0;
  }

  .viz-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .viz-description {
    font-family: var(--main-font);
    color: var(--text-secondary);
    line-height: 1.65;
    font-size: 0.95em;
    margin: var(--space-2) 0 var(--space-3);
  }

  .viz-container {
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    overflow: hidden;
    background: white;
    margin: var(--space-2) 0;
    position: relative;
    display: flex;
    justify-content: center;
  }

  .viz-container-wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 var(--space-5);
  }

  .viz-links {
    margin-top: var(--space-3);
    display: flex;
    gap: var(--space-1);
    flex-wrap: wrap;
  }

  .viz-link {
    font-family: var(--mono-font);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 10px 16px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    background: var(--bg-color);
    transition: all 0.2s ease;
    font-weight: 450;
  }

  .viz-link:hover {
    background: var(--card-bg-color);
    border-color: var(--border-hover);
    color: var(--text-color);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .viz-link svg {
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  .viz-link:hover svg {
    opacity: 1;
  }

  .viz-container iframe {
    width: 100%;
    min-width: 600px;
    border: none;
    background: white;
    margin: auto;
  }

  /* ========================================
     RESPONSIVE DESIGN
     ======================================== */
  @media (max-width: 768px) {
    .projects-container {
      padding: var(--space-3);
    }

    .viz-container-wrapper {
      padding: var(--space-3);
    }

    .project-card,
    .viz-card {
      padding: var(--space-3);
    }

    .portfolio-intro {
      padding: var(--space-4) var(--space-3) var(--space-3);
    }

    .portfolio-intro h1 {
      font-size: 1.3em;
    }

    .viz-header {
      flex-direction: column;
    }

    .viz-container {
      margin: var(--space-1) calc(-1 * var(--space-2));
      padding: 0 var(--space-2);
      border-radius: 0;
    }
  }

  /* Touch interactions */
  @media (hover: none) {
    .project-card:active,
    .viz-card:active {
      transform: scale(0.99);
    }

    .link-button:active,
    .viz-link:active,
    .desc-button:active {
      transform: scale(0.97);
    }
  }

  /* ========================================
     UTILITY CLASSES
     ======================================== */

  /* Fade in animation for page elements */
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .project-card,
    .viz-card {
      animation: fadeUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }

    .project-card:nth-child(1) { animation-delay: 0.05s; }
    .project-card:nth-child(2) { animation-delay: 0.1s; }
    .project-card:nth-child(3) { animation-delay: 0.15s; }
    .project-card:nth-child(4) { animation-delay: 0.2s; }
    .project-card:nth-child(5) { animation-delay: 0.25s; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Print styles */
  @media print {
    .project-card,
    .viz-card {
      box-shadow: none;
      border: 1px solid #ddd;
      break-inside: avoid;
    }
  }
</style>
