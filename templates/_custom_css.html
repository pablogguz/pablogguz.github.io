<style>
  /* =====================================================================
     CARBON EDITORIAL — design system for pablogguz.github.io
     IBM Plex everywhere · one accent color · quiet, deliberate motion
     ---------------------------------------------------------------------
     HOW TO CUSTOMIZE
     Every visual decision hangs off the tokens in section 1 below.
     · Change --accent and the whole site re-skins itself: links, hovers,
       selection, focus rings, scrollbars, cursors — all derived from it
       with color-mix().
     · Change --font-sans / --font-mono / --font-serif to swap typefaces
       (update _custom_font.html to load them).
     · Change --speed / --ease to make the whole site feel snappier or
       lazier. Set --speed: 0ms to kill motion entirely.
     Light palette lives in section 2, dark palette in section 3.
     ===================================================================== */

  body {
    /* -------------------------------------------------------------
       1 · THE KNOBS — edit these first
       ------------------------------------------------------------- */
    --accent:        #0f62fe;                /* IBM blue 60 — the one brand color */
    --accent-strong: #0043ce;                /* hover / pressed states */

    --font-sans:  "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;

    --radius:     6px;                       /* buttons, inputs, small things */
    --radius-lg:  10px;                      /* cards, modals, images */

    --speed:      220ms;                     /* micro-interactions */
    --speed-slow: 550ms;                     /* entrances, reveals */
    --ease:        cubic-bezier(0.2, 0, 0, 1);        /* decisive but smooth */
    --ease-spring: cubic-bezier(0.34, 1.56, 0.4, 1);  /* playful overshoot */

    /* -------------------------------------------------------------
       2 · LIGHT PALETTE — warm paper + ink
       ------------------------------------------------------------- */
    --bg-color:       #faf9f6;
    --bg-secondary:   #f1efe9;
    --card-bg-color:  #ffffff;
    --text-color:     #191817;
    --text-secondary: #504e48;
    --text-pale-color:#8f8c83;
    --border-color:   #e6e3da;
    --border-hover:   #cfcbbe;

    /* callouts (IBM-ish hues) */
    --callout-note-color:      #0f62fe;
    --callout-important-color: #8a3ffc;
    --callout-warning-color:   #8e6a00;
    --callout-alert-color:     #da1e28;
    --callout-question-color:  #0072c3;
    --callout-tip-color:       #198038;

    /* shadows — soft, layered */
    --shadow-sm:    0 1px 2px rgba(25, 24, 23, 0.05);
    --shadow-md:    0 4px 14px rgba(25, 24, 23, 0.07);
    --shadow-lg:    0 12px 32px rgba(25, 24, 23, 0.10);
    --shadow-hover: 0 14px 40px rgba(25, 24, 23, 0.12);

    /* -------------------------------------------------------------
       3 · DERIVED + LEGACY TOKENS (consumed by the serene theme;
           rarely need editing — they follow the knobs above)
       ------------------------------------------------------------- */
    --primary-color:      var(--accent);
    --primary-hover:      var(--accent-strong);
    --primary-pale-color: color-mix(in srgb, var(--accent) 8%, transparent);
    --accent-color:       var(--accent);
    --accent-pale:        color-mix(in srgb, var(--accent) 10%, transparent);
    --highlight-mark-color: color-mix(in srgb, var(--accent) 16%, transparent);

    --main-font: var(--font-sans);
    --mono-font: var(--font-mono);
    --code-font: var(--font-mono);
    --pixel-font-display: var(--font-mono);  /* legacy hook used by table headers */

    --img-border-radius:     var(--radius-lg);
    --callout-border-radius: var(--radius);
    --detail-border-radius:  var(--radius);
    --detail-border-color:   var(--border-color);
    --inline-code-bg-color:  var(--bg-secondary);
    --dark-mode-img-brightness:   0.92;
    --dark-mode-chart-brightness: 0.90;

    /* spacing — 8px grid */
    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;
    --space-5: 48px;
    --space-6: 64px;

    /* layout */
    --homepage-max-width: 680px;
    --main-max-width:     680px;
    --avatar-size:        56px;
    --icon-size:          18px;
    --homepage-font-size:   16px;
    --homepage-line-height: 1.7;
    --paragraph-font-size:  17px;
    --paragraph-line-height:1.75;
    --aside-font-size:      14px;

    /* rendering */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
  }

  /* -------------------------------------------------------------
     3b · DARK PALETTE — carbon + electric blue
     ------------------------------------------------------------- */
  body.dark {
    --accent:        #78a9ff;                /* IBM blue 40 */
    --accent-strong: #a6c8ff;                /* IBM blue 30 */

    --bg-color:       #131312;
    --bg-secondary:   #1c1c1a;
    --card-bg-color:  #1b1b1a;
    --text-color:     #e8e6e1;
    --text-secondary: #b3b0a8;
    --text-pale-color:#767268;
    --border-color:   #2a2927;
    --border-hover:   #403e3a;

    --callout-note-color:      #78a9ff;
    --callout-important-color: #be95ff;
    --callout-warning-color:   #d2a106;
    --callout-alert-color:     #fa4d56;
    --callout-question-color:  #33b1ff;
    --callout-tip-color:       #42be65;

    --shadow-sm:    0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md:    0 4px 14px rgba(0, 0, 0, 0.35);
    --shadow-lg:    0 12px 32px rgba(0, 0, 0, 0.45);
    --shadow-hover: 0 14px 40px rgba(0, 0, 0, 0.5);
  }

  /* =====================================================================
     4 · GLOBAL ATMOSPHERE
     ===================================================================== */

  /* faint dot grid + accent glow at the top of every page */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(1100px 480px at 50% -12%,
        color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%),
      radial-gradient(color-mix(in srgb, var(--text-color) 6%, transparent) 1px, transparent 1px);
    background-size: auto, 26px 26px;
    -webkit-mask-image: linear-gradient(to bottom, black, black 55%, transparent 95%);
    mask-image: linear-gradient(to bottom, black, black 55%, transparent 95%);
  }

  ::selection {
    background-color: var(--accent);
    color: var(--bg-color);
  }

  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* slim, quiet scrollbar */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
    border-left: none;
  }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--text-color) 22%, transparent);
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
    background-clip: content-box;
  }

  /* transitions are opt-in, not global */
  a, button, input, textarea, img, svg,
  .project-card, .viz-card, .link-button, .desc-button, .tag {
    transition:
      color var(--speed) var(--ease),
      background-color var(--speed) var(--ease),
      border-color var(--speed) var(--ease),
      box-shadow var(--speed) var(--ease),
      transform var(--speed) var(--ease),
      opacity var(--speed) var(--ease);
  }

  body.theme-transition,
  body.theme-transition * {
    transition: background-color 0.35s ease, color 0.2s ease, border-color 0.2s ease !important;
  }

  /* =====================================================================
     5 · HEADER + NAV
     ===================================================================== */

  header {
    border-bottom: 1px solid color-mix(in srgb, var(--border-color) 80%, transparent);
  }

  @supports (backdrop-filter: none) or (-webkit-backdrop-filter: none) {
    header.blur {
      background-color: color-mix(in srgb, var(--bg-color) 72%, transparent);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      backdrop-filter: blur(14px) saturate(1.4);
    }
    body.dark header.blur {
      background-color: color-mix(in srgb, var(--bg-color) 72%, transparent);
    }
  }

  header nav {
    font-family: var(--font-mono);
    font-size: 0.95em;
  }

  /* nav links: sliding underline instead of background pill */
  header nav a {
    position: relative;
    padding: 4px 2px;
    margin: 0 6px;
    border-radius: 0;
    background: none;
  }
  header nav a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1.5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--speed) var(--ease);
  }
  header nav a:hover {
    color: var(--accent);
    background: none;
  }
  header nav a:hover::after {
    transform: scaleX(1);
  }

  /* brand link — first item in the nav */
  header nav > a:first-of-type {
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header nav .separator {
    color: var(--accent);
    font-weight: 600;
  }

  /* theme toggle micro-interaction */
  #theme-toggle svg {
    transition: transform var(--speed) var(--ease-spring);
  }
  #theme-toggle:hover svg {
    transform: rotate(-14deg) scale(1.12);
  }
  #theme-toggle:active svg {
    transform: scale(0.85);
  }

  /* reading progress bar (injected by js on post pages) */
  #scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 999;
    transform: scaleX(0);
    transform-origin: 0 50%;
    background: linear-gradient(90deg, var(--accent), var(--accent-strong));
  }

  /* =====================================================================
     6 · HOMEPAGE — staggered entrance, terminal greeting
     ===================================================================== */

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes caret-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: no-preference) {
    body.homepage #info   { animation: rise var(--speed-slow) var(--ease) 0.05s backwards; }
    body.homepage #links  { animation: rise var(--speed-slow) var(--ease) 0.13s backwards; }
    body.homepage #brief > * { animation: rise var(--speed-slow) var(--ease) backwards; }
    body.homepage #brief > *:nth-child(1) { animation-delay: 0.21s; }
    body.homepage #brief > *:nth-child(2) { animation-delay: 0.28s; }
    body.homepage #brief > *:nth-child(3) { animation-delay: 0.35s; }
    body.homepage #brief > *:nth-child(4) { animation-delay: 0.42s; }
    body.homepage #brief > *:nth-child(5) { animation-delay: 0.49s; }
    body.homepage #brief > *:nth-child(n+6) { animation-delay: 0.56s; }
  }

  /* avatar — sharp card with a soft lift */
  #myAvatar {
    width: 112px !important;
    height: auto !important;
    border-radius: var(--radius-lg) !important;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-md);
    filter: saturate(0.92);
    transition: transform 0.35s var(--ease-spring), box-shadow 0.35s var(--ease), filter 0.35s var(--ease);
  }
  #myAvatar:hover {
    transform: translateY(-3px) rotate(-1deg);
    box-shadow: var(--shadow-lg);
    filter: saturate(1.05);
  }

  /* "hey!" — oversized serif greeting with a blinking terminal caret */
  body.homepage #brief > p:first-of-type {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.9em;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text-color);
    margin: 0.4em 0 0.6em;
  }
  body.homepage #brief > p:first-of-type::after {
    content: "";
    display: inline-block;
    width: 0.45em;
    height: 0.95em;
    margin-left: 0.18em;
    vertical-align: -0.08em;
    background: var(--accent);
    animation: caret-blink 1.1s steps(1) infinite;
  }

  /* homepage section links — mono, sliding underline */
  body.homepage #links #left {
    font-family: var(--font-mono);
  }
  body.homepage #links #left a {
    border-bottom: none;
    position: relative;
    padding-bottom: 3px;
  }
  body.homepage #links #left a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1.5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--speed) var(--ease);
  }
  body.homepage #links #left a:hover::after {
    transform: scaleX(1);
  }

  /* social icons — lift on hover */
  body.homepage #links #right a:hover,
  body.homepage #links #right button:hover {
    transform: translateY(-2px);
    color: var(--accent);
  }

  /* =====================================================================
     7 · POST LISTS (blog + home list layouts)
     ===================================================================== */

  .layout-list .post {
    font-family: var(--font-sans);
    color: var(--text-color);
    font-weight: 500;
    padding: 10px 0;
    margin: 2px 0;
    border-bottom: 1px solid var(--border-color);
    transition: border-color var(--speed) var(--ease);
  }
  .layout-list .post > span:first-child {
    display: inline-block;
    transition: transform var(--speed) var(--ease), color var(--speed) var(--ease);
  }
  .layout-list .post .date {
    font-family: var(--font-mono);
    font-size: 0.82em;
    color: var(--text-pale-color);
    transition: color var(--speed) var(--ease);
  }
  .layout-list .post:hover {
    border-bottom-color: var(--accent);
  }
  .layout-list .post:hover > span:first-child {
    color: var(--accent);
    transform: translateX(6px);
  }
  .layout-list .post:hover .date {
    color: var(--accent);
  }
  .layout-list .post.featured::before {
    color: var(--accent);
  }

  /* =====================================================================
     8 · CARDS (projects / policy / dataviz)
     ===================================================================== */

  #wrapper.wide-layout {
    max-width: 1400px !important;
    padding: 0 24px;
  }
  #wrapper.wide-layout main {
    max-width: 100%;
  }

  .projects-container {
    max-width: 100%;
    margin: 0 auto;
    padding: var(--space-3) 0;
  }

  .project-grid {
    display: grid;
    gap: var(--space-3);
    grid-template-columns: repeat(3, 1fr);
  }
  @media (max-width: 1100px) {
    .project-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .project-grid { grid-template-columns: 1fr; }
    #wrapper.wide-layout { padding: 0 16px; }
  }

  .project-card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin: 0;
    padding: var(--space-4);
    background: var(--card-bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }
  .project-card.compact {
    padding: var(--space-3);
  }
  .project-card .card-content {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* accent line that sweeps across the top on hover */
  .project-card::before {
    content: "";
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 25%, transparent));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--speed-slow) var(--ease);
  }
  .project-card:hover::before {
    transform: scaleX(1);
  }
  .project-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
    transform: translateY(-3px);
  }

  .project-section {
    margin-bottom: var(--space-6);
  }

  .section-title {
    font-family: var(--font-mono);
    font-size: 0.8em;
    font-weight: 500;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    color: var(--text-pale-color);
    margin-bottom: var(--space-3);
    padding-bottom: var(--space-1);
    border-bottom: 1px solid var(--border-color);
  }
  .section-title::before {
    content: "// ";
    color: var(--accent);
  }

  .project-title {
    font-family: var(--font-sans);
    font-size: 1.02em;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-color);
    margin: 0 0 var(--space-2) 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .project-icon {
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .project-desc {
    font-family: var(--font-sans);
    color: var(--text-secondary);
    line-height: 1.65;
    font-size: 0.9em;
    margin-bottom: var(--space-2);
    flex: 1;
  }

  .project-links {
    display: flex;
    gap: var(--space-1);
    flex-wrap: wrap;
    margin-top: auto;
    padding-top: var(--space-2);
  }

  /* media coverage strip */
  .media-section {
    margin: 0;
    margin-top: var(--space-2);
    padding-top: var(--space-2);
    border-top: 1px dashed var(--border-color);
  }
  .media-label {
    font-family: var(--font-mono);
    display: block;
    color: var(--text-pale-color);
    margin-bottom: var(--space-1);
    font-size: 0.68em;
    text-transform: lowercase;
    letter-spacing: 0.08em;
  }
  .media-label::before {
    content: "» ";
    color: var(--accent);
  }
  .media-links {
    display: flex;
    gap: 4px var(--space-2);
    flex-wrap: wrap;
  }
  .media-links a {
    font-family: var(--font-sans);
    color: var(--text-secondary);
    text-decoration: none;
    padding: 2px 0;
    font-size: 0.85em;
    border-bottom: 1px solid transparent;
  }
  .media-links a::after {
    content: "↗";
    font-size: 0.8em;
    margin-left: 3px;
    opacity: 0.45;
    transition: opacity var(--speed) var(--ease);
  }
  .media-links a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .media-links a:hover::after {
    opacity: 1;
  }

  /* tags — quiet mono pills */
  .project-tags,
  .viz-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: var(--space-2);
  }
  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: lowercase;
    letter-spacing: 0.03em;
    color: var(--text-pale-color);
    padding: 3px 10px;
    border: 1px solid var(--border-color);
    border-radius: 99px;
    background: var(--bg-secondary);
  }
  .project-card:hover .tag {
    border-color: var(--border-hover);
  }

  /* =====================================================================
     9 · BUTTONS
     ===================================================================== */

  .desc-button,
  .link-button,
  .viz-link,
  .share-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    padding: 9px 14px;
    height: auto;
    line-height: 1.4;
    border-radius: var(--radius);
    cursor: pointer;
    outline: none;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .desc-button:hover,
  .link-button:hover,
  .viz-link:hover,
  .share-btn:hover {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border-color));
    background: color-mix(in srgb, var(--accent) 5%, var(--bg-color));
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .desc-button:active,
  .link-button:active,
  .viz-link:active,
  .share-btn:active {
    transform: translateY(0);
    box-shadow: var(--shadow-sm);
  }

  .desc-button .triangle {
    display: inline-block;
    transition: transform var(--speed) var(--ease);
  }
  .desc-button.collapsed .triangle {
    transform: rotate(-90deg);
  }
  .desc {
    font-size: 0.9em;
    color: var(--text-secondary);
    line-height: 1.65;
  }

  /* =====================================================================
     10 · VIZ CARDS (dataviz page)
     ===================================================================== */

  .viz-card {
    position: relative;
    overflow: hidden;
    background: var(--card-bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin: var(--space-4) auto;
    max-width: 1300px;
    box-shadow: var(--shadow-sm);
  }
  .viz-card::before {
    content: "";
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 25%, transparent));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--speed-slow) var(--ease);
  }
  .viz-card:hover::before {
    transform: scaleX(1);
  }
  .viz-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
    transform: translateY(-3px);
  }

  .viz-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: var(--space-2);
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .viz-header h2 {
    font-family: var(--font-sans);
    font-size: 1.05em;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text-color);
  }
  .viz-description {
    font-family: var(--font-sans);
    color: var(--text-secondary);
    line-height: 1.65;
    font-size: 0.95em;
    margin: var(--space-2) 0 var(--space-3);
  }
  .viz-container {
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    overflow: hidden;
    background: white;
    margin: var(--space-2) 0;
