<style>
  /* =====================================================================
     CARBON EDITORIAL · RETRO-MINIMAL — design system for pablogguz.github.io
     IBM Plex everywhere · one ink accent · warm paper · hairlines · no ornament
     Structure comes from 1px rules, mono labels and whitespace. The only
     "retro" flourishes are the blinking caret on the homepage greeting, the
     numbered blog entries, and the ∎ end mark on posts.
     ---------------------------------------------------------------------
     HOW TO CUSTOMIZE
     Every visual decision hangs off the tokens in section 1 below.
     · Change --accent and the whole site re-skins itself: links, hovers,
       selection, focus rings, scrollbars, cursors — all derived from it
       with color-mix().
     · Change --font-sans / --font-mono / --font-serif to swap typefaces
       (update _custom_font.html to load them).
     · Change --speed / --ease to make the whole site feel snappier or
       lazier. Set --speed: 0ms to kill motion entirely.
     Light palette lives in section 2, dark palette in section 3.
     ===================================================================== */

  body {
    /* -------------------------------------------------------------
       1 · THE KNOBS — edit these first
       ------------------------------------------------------------- */
    --accent:        #0f62fe;                /* IBM blue 60 — ink: links, focus, data points */
    --accent-strong: #0043ce;                /* hover / pressed states */
    --accent-2:      #f1c21b;                /* IBM yellow 30 — marker: highlighter, tape, stamps */
    --accent-2-ink:  #8e6a00;                /* the marker as *text* (readable on paper) */
    --live:          #24a148;                /* IBM green 50 — "this app is live" pulse */

    --font-sans:  "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;

    --radius:     2px;                       /* buttons, inputs, small things */
    --radius-lg:  3px;                       /* cards, modals, images */

    --speed:      220ms;                     /* micro-interactions */
    --speed-slow: 550ms;                     /* entrances, reveals */
    --ease:        cubic-bezier(0.2, 0, 0, 1);        /* decisive but smooth */
    --ease-spring: cubic-bezier(0.34, 1.56, 0.4, 1);  /* playful overshoot */

    /* -------------------------------------------------------------
       2 · LIGHT PALETTE — warm paper + ink
       ------------------------------------------------------------- */
    --bg-color:       #faf9f6;
    --bg-secondary:   #f1efe9;
    --card-bg-color:  #ffffff;
    --text-color:     #191817;
    --text-secondary: #504e48;
    --text-pale-color:#8f8c83;
    --border-color:   #e6e3da;
    --border-hover:   #cfcbbe;

    /* callouts (IBM-ish hues) */
    --callout-note-color:      #0f62fe;
    --callout-important-color: #8a3ffc;
    --callout-warning-color:   #8e6a00;
    --callout-alert-color:     #da1e28;
    --callout-question-color:  #0072c3;
    --callout-tip-color:       #198038;

    /* shadows — none; depth comes from hairlines (the modal keeps one) */
    --shadow-sm:    none;
    --shadow-md:    none;
    --shadow-lg:    0 16px 48px rgba(25, 24, 23, 0.14);
    --shadow-hover: none;

    /* -------------------------------------------------------------
       3 · DERIVED + LEGACY TOKENS (consumed by the serene theme;
           rarely need editing — they follow the knobs above)
       ------------------------------------------------------------- */
    --primary-color:      var(--accent);
    --primary-hover:      var(--accent-strong);
    --primary-pale-color: color-mix(in srgb, var(--accent) 8%, transparent);
    --accent-color:       var(--accent);
    --accent-pale:        color-mix(in srgb, var(--accent) 10%, transparent);
    --highlight-mark-color: color-mix(in srgb, var(--accent) 16%, transparent);

    --main-font: var(--font-sans);
    --mono-font: var(--font-mono);
    --code-font: var(--font-mono);
    --pixel-font-display: var(--font-mono);  /* legacy hook used by table headers */

    --img-border-radius:     var(--radius-lg);
    --callout-border-radius: var(--radius);
    --detail-border-radius:  var(--radius);
    --detail-border-color:   var(--border-color);
    --inline-code-bg-color:  var(--bg-secondary);
    --dark-mode-img-brightness:   0.92;
    --dark-mode-chart-brightness: 0.90;

    /* spacing — 8px grid */
    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;
    --space-5: 48px;
    --space-6: 64px;

    /* layout */
    --homepage-max-width: 680px;
    --main-max-width:     680px;
    --avatar-size:        56px;
    --icon-size:          18px;
    --homepage-font-size:   16px;
    --homepage-line-height: 1.7;
    --paragraph-font-size:  17px;
    --paragraph-line-height:1.75;
    --aside-font-size:      14px;

    /* rendering */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
  }

  /* -------------------------------------------------------------
     3b · DARK PALETTE — carbon + electric blue
     ------------------------------------------------------------- */
  body.dark {
    --accent:        #78a9ff;                /* IBM blue 40 */
    --accent-strong: #a6c8ff;                /* IBM blue 30 */
    --accent-2:      #f1c21b;
    --accent-2-ink:  #f1c21b;
    --live:          #42be65;

    --bg-color:       #131312;
    --bg-secondary:   #1c1c1a;
    --card-bg-color:  #1b1b1a;
    --text-color:     #e8e6e1;
    --text-secondary: #b3b0a8;
    --text-pale-color:#767268;
    --border-color:   #2a2927;
    --border-hover:   #403e3a;

    --callout-note-color:      #78a9ff;
    --callout-important-color: #be95ff;
    --callout-warning-color:   #d2a106;
    --callout-alert-color:     #fa4d56;
    --callout-question-color:  #33b1ff;
    --callout-tip-color:       #42be65;

    --shadow-sm:    none;
    --shadow-md:    none;
    --shadow-lg:    0 16px 48px rgba(0, 0, 0, 0.5);
    --shadow-hover: none;
  }

  /* =====================================================================
     4 · GLOBAL ATMOSPHERE
     ===================================================================== */

  ::selection {
    background-color: var(--accent-2);
    color: #191817;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* slim, quiet scrollbar */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
    border-left: none;
  }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--text-color) 22%, transparent);
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
    background-clip: content-box;
  }

  /* transitions are opt-in, not global */
  a, button, input, textarea, img, svg,
  .project-card, .viz-card, .link-button, .desc-button, .tag {
    transition:
      color var(--speed) var(--ease),
      background-color var(--speed) var(--ease),
      border-color var(--speed) var(--ease),
      box-shadow var(--speed) var(--ease),
      transform var(--speed) var(--ease),
      opacity var(--speed) var(--ease);
  }

  /* theme switch — a single cross-fade of the page (View Transitions API) */
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 0.32s;
    animation-timing-function: var(--ease);
  }
  /* fallback for browsers without view transitions: everything moves in lockstep */
  body.theme-transition,
  body.theme-transition *,
  body.theme-transition *::before,
  body.theme-transition *::after {
    transition:
      background-color 0.32s ease,
      color 0.32s ease,
      border-color 0.32s ease,
      outline-color 0.32s ease,
      fill 0.32s ease,
      stroke 0.32s ease,
      box-shadow 0.32s ease !important;
  }

  /* =====================================================================
     5 · HEADER + NAV
     ===================================================================== */

  header {
    border-bottom: 1px solid color-mix(in srgb, var(--border-color) 80%, transparent);
  }

  @supports (backdrop-filter: none) or (-webkit-backdrop-filter: none) {
    header.blur {
      background-color: color-mix(in srgb, var(--bg-color) 72%, transparent);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      backdrop-filter: blur(14px) saturate(1.4);
    }
    body.dark header.blur {
      background-color: color-mix(in srgb, var(--bg-color) 72%, transparent);
    }
  }

  header nav {
    font-family: var(--font-mono);
    font-size: 0.95em;
  }

  /* nav links: sliding underline instead of background pill */
  header nav a {
    position: relative;
    padding: 4px 2px;
    margin: 0 6px;
    border-radius: 0;
    background: none;
  }
  header nav a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1.5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--speed) var(--ease);
  }
  header nav a:hover {
    color: var(--accent);
    background: none;
  }
  header nav a:hover::after {
    transform: scaleX(1);
  }

  /* brand link — first item in the nav */
  header nav > a:first-of-type {
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header nav .separator {
    color: var(--accent);
    font-weight: 600;
  }

  /* theme toggle micro-interaction */
  #theme-toggle svg {
    transition: transform var(--speed) var(--ease-spring);
  }
  #theme-toggle:hover svg {
    transform: rotate(-14deg) scale(1.12);
  }
  #theme-toggle:active svg {
    transform: scale(0.85);
  }

  /* reading progress bar (injected by js on post pages) */
  #scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 999;
    transform: scaleX(0);
    transform-origin: 0 50%;
    background: var(--accent);
  }

  /* =====================================================================
     6 · HOMEPAGE — staggered entrance, terminal greeting
     ===================================================================== */

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes caret-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: no-preference) {
    body.homepage #info   { animation: rise var(--speed-slow) var(--ease) 0.05s backwards; }
    body.homepage #links  { animation: rise var(--speed-slow) var(--ease) 0.13s backwards; }
    body.homepage #brief > * { animation: rise var(--speed-slow) var(--ease) backwards; }
    body.homepage #brief > *:nth-child(1) { animation-delay: 0.21s; }
    body.homepage #brief > *:nth-child(2) { animation-delay: 0.28s; }
    body.homepage #brief > *:nth-child(3) { animation-delay: 0.35s; }
    body.homepage #brief > *:nth-child(4) { animation-delay: 0.42s; }
    body.homepage #brief > *:nth-child(5) { animation-delay: 0.49s; }
    body.homepage #brief > *:nth-child(n+6) { animation-delay: 0.56s; }
  }

  /* the author — a plain framed photo */
  body.homepage #info {
    align-items: flex-start;
    gap: 34px;
    padding-top: 8px;
  }
  .polaroid {
    flex-shrink: 0;
    width: 112px;
    margin: 0;
    padding: 0;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--card-bg-color);
  }
  body.homepage #info .polaroid img,
  #myAvatar {
    display: block;
    width: 100% !important;
    height: auto !important;
    border-radius: 0 !important;
    border: none;
    box-shadow: none;
    filter: saturate(0.9);
  }

  body.homepage #brief strong {
    font-weight: 600;
  }

  /* "hey!" — oversized serif greeting with a blinking terminal caret */
  body.homepage #brief > p:first-of-type {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.9em;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text-color);
    margin: 0.4em 0 0.6em;
  }
  body.homepage #brief > p:first-of-type::after {
    content: "";
    display: inline-block;
    width: 0.45em;
    height: 0.95em;
    margin-left: 0.18em;
    vertical-align: -0.08em;
    background: var(--accent);
    animation: caret-blink 1.1s steps(1) infinite;
  }

  /* homepage section links — mono, sliding underline */
  body.homepage #links #left {
    font-family: var(--font-mono);
  }
  body.homepage #links #left a {
    border-bottom: none;
    position: relative;
    padding-bottom: 3px;
  }
  body.homepage #links #left a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1.5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--speed) var(--ease);
  }
  body.homepage #links #left a:hover::after {
    transform: scaleX(1);
  }

  /* social icons — lift on hover */
  body.homepage #links #right a:hover,
  body.homepage #links #right button:hover {
    color: var(--accent);
  }

  /* =====================================================================
     7 · POST LISTS (blog + tag pages) — numbered notebook entries
     ===================================================================== */

  .layout-list .post {
    display: grid;
    grid-template-columns: 2.5em minmax(0, 1fr) auto;
    grid-template-areas:
      "idx title date"
      "idx desc  desc";
    align-items: baseline;
    column-gap: 10px;
    row-gap: 3px;
    position: relative;
    font-family: var(--font-sans);
    color: var(--text-color);
    font-weight: 500;
    padding: 12px 0;
    margin: 2px 0;
    border-bottom: 1px solid var(--border-color);
    transition: border-color var(--speed) var(--ease);
  }
  .layout-list .post .post-index {
    grid-area: idx;
    font-family: var(--font-mono);
    font-size: 0.78em;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--text-pale-color);
    font-variant-numeric: tabular-nums;
    transition: color var(--speed) var(--ease);
  }
  .layout-list .post .post-title {
    grid-area: title;
    display: inline-block;
    transition: transform var(--speed) var(--ease), color var(--speed) var(--ease);
  }
  .layout-list .post .date {
    grid-area: date;
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 0.82em;
    color: var(--text-pale-color);
    white-space: nowrap;
    transition: color var(--speed) var(--ease);
  }
  .layout-list .post .post-desc {
    grid-area: desc;
    font-family: var(--font-sans);
    font-size: 0.84em;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.55;
  }
  .layout-list .post:hover {
    border-bottom-color: var(--accent);
  }
  .layout-list .post:hover .post-title {
    color: var(--accent);
  }
  .layout-list .post:hover .post-index,
  .layout-list .post:hover .date {
    color: var(--accent);
  }
  .layout-list .post.featured::before {
    color: var(--accent);
  }
  @media (max-width: 600px) {
    .layout-list .post {
      grid-template-columns: 2.2em minmax(0, 1fr);
      grid-template-areas:
        "idx title"
        "idx date"
        "idx desc";
    }
  }

  /* quiet "read" mark — replaces the index once you've finished the post */
  .layout-list .post .stamp {
    grid-area: idx;
    display: none;
    font-family: var(--font-mono);
    font-size: 0.72em;
    letter-spacing: 0.06em;
    color: var(--accent);
  }
  .layout-list .post.is-read .stamp {
    display: inline-block;
  }
  .layout-list .post.is-read .post-index {
    visibility: hidden;
  }
  .layout-list .post.is-read .post-title {
    color: var(--text-secondary);
  }
  .layout-list .post.is-read:hover .post-title {
    color: var(--accent);
  }

  body.blog main,
  body.tag-single main {
    padding-top: 1.25em;
  }
  body.tag-single .title {
    font-family: var(--font-mono);
    font-size: 0.95em;
    letter-spacing: 0.04em;
    text-transform: lowercase;
    color: var(--text-secondary);
  }
  body.tag-single .title a {
    font-family: var(--font-mono);
    color: var(--text-pale-color);
    text-decoration: none;
    border-bottom: 1px dashed var(--border-hover);
  }
  body.tag-single .title a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  body.tag-list .title {
    font-family: var(--font-mono);
    font-size: 0.95em;
    letter-spacing: 0.04em;
    text-transform: lowercase;
    color: var(--text-secondary);
  }
  body.tag-list .tags a {
    font-family: var(--font-mono);
    font-size: 0.8em;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 99px;
    padding: 4px 12px;
    margin: 0.4em;
  }
  body.tag-list .tags a:hover {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border-color));
  }

  /* list header: "// essays" + your reading progress */
  .list-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin: 2em 15px 0;
    padding-bottom: var(--space-1);
    border-bottom: 1px solid var(--border-color);
  }
  .list-head .section-title.list-title {
    flex: 1;
    margin: 0;
    padding-bottom: 0;
    border-bottom: none;
  }
  .list-head + .post-list {
    margin-top: 0.75em;
  }
  .read-progress {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--text-pale-color);
    white-space: nowrap;
  }
  .read-progress b {
    font-weight: 600;
    color: var(--text-secondary);
  }
  .read-progress-bar {
    display: block;
    width: 72px;
    height: 2px;
    background: var(--border-color);
    overflow: hidden;
  }
  .read-progress-bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.9s var(--ease);
  }
  .read-progress.complete b,
  .read-progress.complete {
    color: var(--accent);
  }

  /* =====================================================================
     8 · CARDS (projects / policy / dataviz)
     ===================================================================== */

  #wrapper.wide-layout {
    max-width: 1400px !important;
    padding: 0 24px;
  }
  #wrapper.wide-layout main {
    max-width: 100%;
  }

  .projects-container {
    max-width: 100%;
    margin: 0 auto;
    padding: var(--space-3) 0;
  }

  .project-grid {
    display: grid;
    gap: var(--space-3);
    grid-template-columns: repeat(3, 1fr);
  }
  @media (max-width: 1100px) {
    .project-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .project-grid { grid-template-columns: 1fr; }
    #wrapper.wide-layout { padding: 0 16px; }
  }

  .project-card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin: 0;
    padding: var(--space-4);
    background: var(--card-bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }
  .project-card.compact {
    padding: var(--space-3);
  }
  .project-card .card-content {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* accent line that sweeps across the top on hover */
  .project-card::before {
    content: "";
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 25%, transparent));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--speed-slow) var(--ease);
  }
  .project-card::before {
    display: none;
  }
  .project-card:hover {
    border-color: var(--text-pale-color);
  }

  .project-section {
    margin-bottom: var(--space-6);
  }

  .section-title {
    font-family: var(--font-mono);
    font-size: 0.8em;
    font-weight: 500;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    color: var(--text-pale-color);
    margin-bottom: var(--space-3);
    padding-bottom: var(--space-1);
    border-bottom: 1px solid var(--border-color);
  }

  .project-title {
    font-family: var(--font-sans);
    font-size: 1.02em;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-color);
    margin: 0 0 var(--space-2) 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .project-icon {
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .project-desc {
    font-family: var(--font-sans);
    color: var(--text-secondary);
    line-height: 1.65;
    font-size: 0.9em;
    margin-bottom: var(--space-2);
    flex: 1;
  }

  .project-links {
    display: flex;
    gap: var(--space-1);
    flex-wrap: wrap;
    margin-top: auto;
    padding-top: var(--space-2);
  }

  /* media coverage strip */
  .media-section {
    margin: 0;
    margin-top: var(--space-2);
    padding-top: var(--space-2);
    border-top: 1px dashed var(--border-color);
  }
  .media-label {
    font-family: var(--font-mono);
    display: block;
    color: var(--text-pale-color);
    margin-bottom: var(--space-1);
    font-size: 0.68em;
    text-transform: lowercase;
    letter-spacing: 0.08em;
  }
  .media-links {
    display: flex;
    gap: 4px var(--space-2);
    flex-wrap: wrap;
  }
  .media-links a {
    font-family: var(--font-sans);
    color: var(--text-secondary);
    text-decoration: none;
    padding: 2px 0;
    font-size: 0.85em;
    border-bottom: 1px solid transparent;
  }
  .media-links a::after {
    content: "↗";
    font-size: 0.8em;
    margin-left: 3px;
    opacity: 0.45;
    transition: opacity var(--speed) var(--ease);
  }
  .media-links a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .media-links a:hover::after {
    opacity: 1;
  }

  /* tags — quiet mono pills */
  .project-tags,
  .viz-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: var(--space-2);
  }
  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: lowercase;
    letter-spacing: 0.03em;
    color: var(--text-pale-color);
    padding: 3px 10px;
    border: 1px solid var(--border-color);
    border-radius: 99px;
    background: var(--bg-secondary);
  }
  .project-card:hover .tag {
    border-color: var(--border-hover);
  }

  /* =====================================================================
     9 · BUTTONS
     ===================================================================== */

  .desc-button,
  .link-button,
  .viz-link,
  .share-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    padding: 9px 14px;
    height: auto;
    line-height: 1.4;
    border-radius: var(--radius);
    cursor: pointer;
    outline: none;
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .desc-button:hover,
  .link-button:hover,
  .viz-link:hover,
  .share-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .desc-button .triangle {
    display: inline-block;
    transition: transform var(--speed) var(--ease);
  }
  .desc-button.collapsed .triangle {
    transform: rotate(-90deg);
  }
  .desc {
    font-size: 0.9em;
    color: var(--text-secondary);
    line-height: 1.65;
  }

  /* =====================================================================
     10 · VIZ CARDS (dataviz page)
     ===================================================================== */

  .viz-card {
    position: relative;
    overflow: hidden;
    background: var(--card-bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin: var(--space-4) auto;
    max-width: 1300px;
    box-shadow: var(--shadow-sm);
  }
  .viz-card::before {
    content: "";
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 25%, transparent));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--speed-slow) var(--ease);
  }
  .viz-card::before {
    display: none;
  }
  .viz-card:hover {
    border-color: var(--text-pale-color);
  }

  .viz-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: var(--space-2);
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .viz-header h2 {
    font-family: var(--font-sans);
    font-size: 1.05em;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text-color);
  }
  .viz-description {
    font-family: var(--font-sans);
    color: var(--text-secondary);
    line-height: 1.65;
    font-size: 0.95em;
    margin: var(--space-2) 0 var(--space-3);
  }
  .viz-container {
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    overflow: hidden;
    background: white;
    margin: var(--space-2) 0;
    position: relative;
    display: flex;
    justify-content: center;
  }
  .viz-container-wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 var(--space-5);
  }
  .viz-links {
    margin-top: var(--space-3);
    display: flex;
    gap: var(--space-1);
    flex-wrap: wrap;
  }
  .viz-link svg {
    opacity: 0.7;
    transition: opacity var(--speed) var(--ease);
  }
  .viz-link:hover svg {
    opacity: 1;
  }
  .viz-container iframe {
    width: 100%;
    min-width: 600px;
    border: none;
    background: white;
    margin: auto;
  }

  /* =====================================================================
     11 · PROSE (posts, homepage brief)
     ===================================================================== */

  .prose h1 {
    font-family: var(--font-sans);
    font-size: 1.9em;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.2;
    border-bottom: none;
    padding-bottom: 0;
  }
  .prose h2 {
    letter-spacing: -0.015em;
  }
  .prose h3 {
    letter-spacing: -0.01em;
  }

  /* links — animated underline sweep */
  .prose a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: none;
    font-weight: 500;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-size: 100% 1px;
    background-position: 0 100%;
    background-repeat: no-repeat;
    transition: background-size var(--speed) var(--ease), color var(--speed) var(--ease);
  }
  .prose a:hover {
    color: var(--accent-strong);
    background-image: linear-gradient(var(--accent-strong), var(--accent-strong));
    background-size: 100% 2px;
    opacity: 1;
  }

  /* quieter inline code — let links own the accent */
  .prose p > code,
  .prose li > code,
  .prose td > code,
  .prose th > code {
    color: var(--text-color);
    background-color: var(--inline-code-bg-color);
    border: 1px solid var(--border-color);
  }

  /* blockquotes — serif italic with an accent spine
     (callouts are also <blockquote>s, so exclude them) */
  .prose blockquote:not(.callout) {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.02em;
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  /* callouts — sans, tinted with their own hue */
  .prose blockquote.callout {
    font-family: var(--font-sans);
    font-style: normal;
    background: transparent;
    padding: 10px 14px;
  }

  /* tables — mono headers, no shouting */
  .prose thead {
    font-family: var(--font-mono);
    text-transform: none;
    font-size: 0.85em;
    letter-spacing: 0.02em;
  }
  .prose table {
    border: 1px solid var(--border-color);
  }
  .prose th,
  .prose td {
    border: 1px solid var(--border-color);
  }

  .prose hr {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
  }

  #reading-time {
    font-family: var(--font-mono);
    font-size: 0.82em;
    color: var(--text-pale-color);
  }
  body.post #date {
    font-family: var(--font-mono);
    font-size: 0.9em;
  }
  body.post #tags {
    font-family: var(--font-mono);
    font-size: 0.9em;
  }

  figcaption {
    font-family: var(--font-sans);
    font-size: 0.875em;
    font-weight: 500;
    text-align: center;
    color: var(--text-secondary);
    margin-top: var(--space-2);
    margin-bottom: var(--space-1);
  }
  .figure-note {
    text-align: left;
    font-size: 0.82em !important;
    color: var(--text-pale-color);
  }

  /* toc — active item gets the accent spine */
  body.post aside a.active::before,
  body.post aside a:hover::before {
    background-color: var(--accent);
  }

  /* =====================================================================
     11b · ESSAY TOOLS — share row, cite box, older/newer nav, comments
     ===================================================================== */

  .extras-label {
    font-family: var(--font-mono);
    font-size: 0.72em;
    font-weight: 500;
    text-transform: lowercase;
    letter-spacing: 0.08em;
    color: var(--text-pale-color);
  }

  #post-extras {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    margin-top: var(--space-5);
    padding-top: var(--space-3);
    border-top: 1px solid var(--border-color);
  }

  /* share/nav links live inside .prose — kill the animated underline there */
  .prose a.share-btn,
  .prose a.post-nav-item {
    background-image: none;
  }

  .share-row {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    flex-wrap: wrap;
  }
  .share-row .extras-label {
    margin-right: var(--space-1);
  }

  .cite-box {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--card-bg-color);
    box-shadow: var(--shadow-sm);
  }
  .cite-box summary {
    cursor: pointer;
    list-style: none;
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 0.8em;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    user-select: none;
  }
  .cite-box summary::-webkit-details-marker {
    display: none;
  }
  .cite-box summary::after {
    content: "+";
    float: right;
    color: var(--text-pale-color);
    transition: transform var(--speed) var(--ease);
  }
  .cite-box[open] summary::after {
    content: "−";
  }
  .cite-box summary:hover {
    color: var(--accent);
  }
  .cite-box .cite-formats {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    padding: var(--space-2) 16px 16px;
    border-top: 1px dashed var(--border-color);
  }
  .cite-box .codeblock {
    margin: 0;
  }
  .cite-box pre.cite-text {
    margin: 0;
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: 0.78em;
    line-height: 1.6;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .post-nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2);
  }
  @media (max-width: 600px) {
    .post-nav { grid-template-columns: 1fr; }
  }
  .post-nav-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: var(--space-2);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--card-bg-color);
    box-shadow: var(--shadow-sm);
    text-decoration: none;
  }
  .post-nav-item.older {
    text-align: right;
  }
  .post-nav-item .post-nav-title {
    font-family: var(--font-sans);
    font-size: 0.88em;
    font-weight: 500;
    color: var(--text-color);
    line-height: 1.45;
  }
  .post-nav-item:hover {
    border-color: var(--accent);
  }
  .post-nav-item:hover .post-nav-title {
    color: var(--accent);
  }

  #comments-wrap {
    margin-top: var(--space-4);
    padding-top: var(--space-3);
    border-top: 1px solid var(--border-color);
  }
  #comments-wrap .giscus {
    margin-top: var(--space-2);
  }

  /* blog list — group titles that are NOT inside a .list-head */
  .layout-list > .section-title.list-title {
    margin: 2.5em 15px 0;
  }
  .layout-list > .list-title + .post-list {
    margin-top: 0.75em;
  }

  /* =====================================================================
     11c · POST TAGS + KIND CHIP — quiet mono pills, no hashtags
     ===================================================================== */

  body.post #post-info #tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
    font-size: 1em;
  }
  body.post #post-info #tags a {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: lowercase;
    letter-spacing: 0.03em;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 99px;
    padding: 3px 11px;
    text-decoration: none;
    background-image: none;
  }
  body.post #post-info #tags a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .kind-chip {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border-radius: 99px;
    padding: 2px 9px;
    margin-right: 8px;
  }

  #reading-time svg {
    width: 12px;
    height: 12px;
    vertical-align: -1.5px;
    margin-right: 2px;
  }

  .link-button svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  /* =====================================================================
     11d · CHART FIGURES (the chart(...) shortcode)
     ===================================================================== */

  .prose figure.chart {
    margin: var(--space-4) 0;
    padding: var(--space-3);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--card-bg-color);
    box-shadow: var(--shadow-sm);
  }
  .chart-head {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: var(--space-2);
    text-align: left;
  }
  .prose a.chart-anchor {
    font-family: var(--font-mono);
    font-size: 0.72em;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-pale-color);
    background-image: none;
    width: fit-content;
  }
  .prose a.chart-anchor:hover {
    color: var(--accent);
  }
  .chart-title {
    font-weight: 600;
    font-size: 0.95em;
    letter-spacing: -0.01em;
    color: var(--text-color);
  }
  .chart-subtitle {
    font-size: 0.85em;
    color: var(--text-secondary);
  }
  figure.chart img {
    margin: 0 auto;
    border-radius: var(--radius);
  }
  figcaption.chart-foot {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: var(--space-2);
    text-align: left;
    font-size: 0.78em;
    font-weight: 400;
    color: var(--text-pale-color);
    line-height: 1.5;
  }

  /* =====================================================================
     11e · SERIES BOX
     ===================================================================== */

  .series-box {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    margin: var(--space-3) 0 var(--space-4);
    padding: var(--space-2) 16px;
    border: 1px solid var(--border-color);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius) var(--radius) 0;
    background: var(--card-bg-color);
    box-shadow: var(--shadow-sm);
  }
  .series-parts {
    margin: 0;
    padding-left: 1.4em;
    font-size: 0.85em;
  }
  .series-parts li {
    margin: 3px 0;
    color: var(--text-secondary);
  }
  .series-parts li::marker {
    font-family: var(--font-mono);
    color: var(--text-pale-color);
  }
  .series-current {
    font-weight: 600;
    color: var(--text-color);
  }

  /* =====================================================================
     11f · SIDENOTES — footnotes in the left margin on wide screens
     ===================================================================== */

  .prose {
    position: relative;
  }
  .sidenote {
    display: none;
  }
  @media (min-width: 1280px) {
    body.post .prose.sidenotes-active .footnote-definition {
      display: none;
    }
    body.post .prose.sidenotes-active .sidenote {
      display: block;
      position: absolute;
      left: -292px;
      width: 240px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
      padding-left: 12px;
      border-left: 2px solid var(--border-color);
      transition: border-color var(--speed) var(--ease);
    }
    .sidenote .sidenote-num {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      margin-right: 6px;
    }
    .sidenote p {
      display: inline;
      font-size: inherit;
      line-height: inherit;
      margin: 0;
    }
    .sidenote.flash {
      border-left-color: var(--accent);
      color: var(--text-color);
    }
  }

  /* =====================================================================
     11g · SEARCH PAGE (pagefind)
     ===================================================================== */

  body.search #wrapper {
    margin: 0 auto;
    max-width: var(--main-max-width);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0 15px;
  }
  body.search main {
    margin: 45px 0;
  }
  .search-title {
    font-family: var(--font-sans);
    font-size: 1.6em;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin-bottom: 0.9em;
  }
  #search {
    --pagefind-ui-scale: 0.9;
    --pagefind-ui-primary: var(--accent);
    --pagefind-ui-text: var(--text-color);
    --pagefind-ui-background: var(--card-bg-color);
    --pagefind-ui-border: var(--border-color);
    --pagefind-ui-tag: var(--bg-secondary);
    --pagefind-ui-border-width: 1px;
    --pagefind-ui-border-radius: var(--radius);
    --pagefind-ui-font: var(--font-sans);
  }
  #search-fallback {
    font-size: 0.9em;
    color: var(--text-secondary);
    border: 1px dashed var(--border-color);
    border-radius: var(--radius);
    padding: var(--space-2);
  }
  #search-btn svg {
    transition: transform var(--speed) var(--ease-spring);
  }
  #search-btn:hover svg {
    transform: scale(1.12);
  }

  /* =====================================================================
     12 · FOOTER
     ===================================================================== */

  footer {
    font-family: var(--font-mono);
    font-size: 0.75em;
    border-top: 1px solid var(--border-color);
    color: var(--text-pale-color);
  }
  .disclaimer,
  .copyright,
  .credits {
    font-size: 1em;
    color: var(--text-pale-color);
  }
  footer a {
    color: var(--text-secondary);
  }
  footer a:hover {
    color: var(--accent);
    text-decoration: none;
  }
  /* =====================================================================
     13 · COFFEE MODAL
     ===================================================================== */

  .modal {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    max-width: 560px;
    background: var(--card-bg-color);
    color: var(--text-color);
    box-shadow: var(--shadow-lg);
    transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
  }
  .modal::backdrop {
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
  }
  .modal-content {
    font-size: 0.95em;
    line-height: 1.65;
  }
  .modal-content h3 {
    font-family: var(--font-sans);
    margin: 0 0 var(--space-3);
    font-size: 1.25em;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .modal-content ul {
    padding-left: var(--space-3);
    margin: var(--space-2) 0;
  }
  .modal-content li {
    margin-bottom: var(--space-1);
    color: var(--text-secondary);
  }
  .modal-close {
    font-family: var(--font-mono);
    font-size: 0.85em;
    font-weight: 500;
    float: right;
    padding: 10px 20px;
    margin-top: var(--space-3);
    background: var(--accent);
    color: var(--bg-color);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .modal-close:hover {
    background: var(--accent-strong);
  }

  #coffee-btn,
  .prose a#coffee-btn {
    text-decoration: none;
    background-image: none;   /* avoid doubling up with the .prose link underline */
    color: var(--accent);
    border-bottom: 1px dashed var(--accent);
    transition: border-bottom-style var(--speed) var(--ease), color var(--speed) var(--ease);
  }
  #coffee-btn:hover,
  .prose a#coffee-btn:hover {
    border-bottom: 1px solid var(--accent-strong);
    color: var(--accent-strong);
  }

  /* =====================================================================
     14 · SCROLL REVEAL (elements tagged by js/main.js)
     ===================================================================== */

  .will-reveal {
    opacity: 0;
    transform: translateY(18px);
    transition:
      opacity var(--speed-slow) var(--ease),
      transform var(--speed-slow) var(--ease);
  }
  .will-reveal.revealed {
    opacity: 1;
    transform: none;
  }

  /* =====================================================================
     14b · NOTEBOOK EXTRAS — essay end, toast, confetti, 404
     ===================================================================== */

  /* tombstone at the end of an essay (∎ = q.e.d.) */
  .essay-end {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: var(--space-5) 0 0;
    font-family: var(--font-mono);
    font-size: 0.72em;
    letter-spacing: 0.06em;
    color: var(--text-pale-color);
  }
  .essay-end::before {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-hover));
  }
  .essay-end .qed {
    font-size: 1.2em;
    line-height: 1;
    color: var(--text-color);
    transition: color var(--speed) var(--ease);
  }
  .essay-end.done .qed,
  .essay-end.done .essay-end-label {
    color: var(--accent);
  }
  .essay-end + #post-extras {
    margin-top: var(--space-3);
    border-top: none;
    padding-top: 0;
  }
